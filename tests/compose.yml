services:
  db:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: test-root-only
      MYSQL_DATABASE: twiiiins_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test-only
    tmpfs: [/var/lib/mysql]
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=test-root-only mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [isolated]
  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
    ports: ['127.0.0.1:18025:8025']
    networks: [isolated, ingress]
  translation:
    image: python:3.12-alpine
    command: [python, /stub/translation_stub.py]
    volumes: ['./translation_stub.py:/stub/translation_stub.py:ro']
    networks: [isolated]
  backend:
    build: { context: ../backend }
    environment:
      SPRING_PROFILES_ACTIVE: test
      JAVA_OPTS: '-Xmx512m -Dapp.env.disabled=true'
      DB_URL: 'jdbc:mysql://db:3306/twiiiins_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC'
      DB_USERNAME: test
      DB_PASSWORD: test-only
      DEFAULT_ADMIN_USERNAME: test-admin
      DEFAULT_ADMIN_PASSWORD: test-password-only
      FILE_UPLOAD_DIR: /tmp/test-uploads
      FILE_BASE_URL: /uploads
      LOG_FILE_PATH: /tmp/test-backend.log
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      NEWSLETTER_ENABLED: 'true'
      NEWSLETTER_TOKEN_KEY: test-token-key-not-for-production-123456789
      NEWSLETTER_PUBLIC_URL: http://localhost:18080
      NEWSLETTER_FROM: newsletter@example.com
      NEWSLETTER_REPLY_TO: reply@example.com
      NEWSLETTER_OPERATOR: TWIIIINS Test
      NEWSLETTER_TEST_RECIPIENTS: test-recipient@example.com
      NEWSLETTER_PER_MINUTE: '1000'
      NEWSLETTER_DAILY_LIMIT: '10000'
      TRANSLATION_ENABLED: 'true'
      GEMINI_API_KEY: local-stub-key
      APP_TRANSLATION_BASE_URL: http://translation:8090
      APP_NEWSLETTER_WORKER_DELAY: '250'
      APP_NEWSLETTER_WORKER_INITIAL_DELAY: '1000'
      APP_TRANSLATION_WORKER_DELAY: '250'
      APP_TRANSLATION_WORKER_INITIAL_DELAY: '1000'
      CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8080/actuator/health']
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks: [isolated]
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:18080:80']
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
    networks: [isolated, ingress]
networks:
  isolated:
    internal: true
  ingress:
    driver: bridge
