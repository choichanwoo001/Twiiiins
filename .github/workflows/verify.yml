name: Verify
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Backend, real MySQL and script contracts
        run: |
          chmod +x backend/gradlew
          cd backend
          ./gradlew test mysqlTest jacocoTestReport bootJar --no-daemon
          cd ..
          python -m unittest discover -s scripts/tests
          python scripts/check-test-coverage.py backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/build/reports
            backend/build/test-results
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unit, component, browser and preview contracts
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          python ../scripts/check-test-coverage.py frontend
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/coverage
            frontend/test-results
            frontend/.cache
          retention-days: 14
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build production assets
        run: |
          chmod +x backend/gradlew
          cd backend && ./gradlew bootJar --no-daemon
          cd ../frontend && npm ci && npm run build
          npx playwright install --with-deps chromium
      - name: Verify additive SQL before Hibernate can repair it
        run: python scripts/test-migrations.py
      - name: Real browser journeys in isolated stack
        run: python scripts/test-stack.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            frontend/test-results
            frontend/.cache
            .local/test-artifacts
          retention-days: 14
  required:
    if: always()
    needs: [backend, frontend, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject skipped, cancelled or failed validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
