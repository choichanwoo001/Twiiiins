name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  # 1. 백엔드 빌드 및 이미지 푸시 (Docker 캐싱 활용)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/twiiiins-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. 프론트엔드 빌드 (병렬 실행)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # 3. EC2 배포 (빌드 완료 후 실행)
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # GHCR 로그인 정보 생성
          echo ${{ secrets.GITHUB_TOKEN }} > gh_token.txt

          # 1. 디스크 공간 확인 및 정리
          echo "=== EC2 배포 시작 ==="
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            export TARGET_DIR="$HOME/twiiiins/Twiiiins"
            
            echo "=== 디스크 공간 확인 (정리 전) ==="
            df -h
            
            echo "=== 컨테이너 및 이미지 정리 ==="
            # 실행 중인 컨테이너 중지 및 삭제
            docker rm -f twiiiins-backend twiiiins-nginx || true
            
            # 기존 이미지 강제 삭제 (공간 확보 핵심)
            docker rmi -f ghcr.io/${{ github.repository_owner }}/twiiiins-backend:latest || true
            docker rmi -f nginx:alpine || true
            
            # 시스템 정리 (사용하지 않는 모든 이미지, 컨테이너, 볼륨, 네트워크 삭제)
            docker system prune -af --volumes || true
            
            echo "=== 디스크 공간 확인 (정리 후) ==="
            df -h

            # 2. 디렉토리 설정 (권한 문제 방지)
            export TARGET_DIR="$HOME/twiiiins/Twiiiins"
            mkdir -p $TARGET_DIR/frontend
            mkdir -p $TARGET_DIR/backend/uploads
            
            # 업로드 디렉토리 권한 설정 (컨테이너가 쓸 수 있도록 777 부여)
            chmod 777 $TARGET_DIR/backend/uploads
          ENDSSH
          
          # 2. 파일 전송
          # GHCR 토큰 전송
          scp -i ~/.ssh/deploy_key gh_token.txt $EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/gh_token.txt

          echo "=== 프론트엔드 dist 전송 ==="
          # rsync로 dist 전송 (이미 빌드된 파일)
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ $EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/frontend/dist
          
          # docker-compose.yml 전송
          echo "=== docker-compose.yml 전송 ==="
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml $EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/
            
          # 3. 원격 실행
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST "
            cd ~/twiiiins/Twiiiins
            
            # GHCR 로그인
            cat gh_token.txt | docker login ghcr.io -u $USERNAME --password-stdin
            rm gh_token.txt

            # 최신 이미지 다운로드
            echo "=== Docker 이미지 Pull ==="
            docker-compose pull backend
            
            # 서비스 실행
            echo "=== Docker Compose Up ==="
            docker-compose up -d
            docker-compose ps
            
            # 로그 확인 (실행 실패 시 원인 파악용)
            echo "=== Backend Container Logs ==="
            sleep 5
            docker logs twiiiins-backend 2>&1 | tail -n 50 || echo "Container not running, checking stopped container logs..."
          "
          
          # SSH 키 정리
          rm -f ~/.ssh/deploy_key
          rm -f gh_token.txt
