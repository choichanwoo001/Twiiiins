name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  # 1. 빌드 및 이미지 푸시 (GitHub Actions 서버에서 실행)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 프론트엔드 빌드 (정적 파일 생성)
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        working-directory: ./backend
        run: chmod +x gradlew && ./gradlew clean build -x test

      # Docker 이미지 빌드 및 GHCR 푸시
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/twiiiins-backend:latest
          # 빌드 아티팩트(JAR)를 Dockerfile에서 활용하려면 context를 backend로 지정해야 함

  # 2. EC2 배포 (이미지만 다운로드해서 실행)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # GHCR 로그인 정보 생성 (EC2에서 로그인하기 위함)
          echo ${{ secrets.GITHUB_TOKEN }} > gh_token.txt

          # 1. 디스크 정리 및 준비
          echo "=== EC2 배포 시작 ==="
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            # 작업 디렉토리 생성
            mkdir -p /home/ubuntu/twiiiins/Twiiiins/frontend
            mkdir -p /home/ubuntu/twiiiins/Twiiiins/backend
            
            # 1.1 시스템 및 도커 정리 (공간 확보)
            sudo journalctl --vacuum-size=50M || true
            docker system prune -af --volumes || true
            
            # 1.2 기존 컨테이너 중지
            cd /home/ubuntu/twiiiins/Twiiiins || true
            if [ -f "docker-compose.yml" ]; then
              docker-compose down || true
            fi
            
            # 디스크 공간 확인
            df -h
          ENDSSH
          
          # 2. 파일 전송 (dist, docker-compose 등)
          # GHCR 토큰 전송
          scp -i ~/.ssh/deploy_key gh_token.txt $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/gh_token.txt

          # 프론트엔드 dist 전송 (Artifact 사용 대신 다시 빌드해서 전송하거나, 여기서는 로컬 빌드 후 전송 가정)
          # 주: build-and-push 잡과 분리되어 있어 프론트엔드 빌드 결과물이 여기 없음.
          # 해결: 프론트엔드 빌드를 deploy 잡에서도 하거나, artifact로 넘겨야 함. 
          # 간편함을 위해 deploy 잡에서 프론트엔드 빌드 및 전송 수행 (또는 기존 방식 유지)
          
          # 수정: build-and-push 에서 프론트엔드 빌드한 것을 artifact로 넘기는 게 정석이나, 
          # 복잡도를 줄이기 위해 여기서 프론트엔드 빌드만 다시 수행 (빠름)하거나
          # 1번 잡에서 다 하고 여기서는 SSH 명령만 내리는게 좋음.
          # 하지만 프론트엔드 정적 파일은 EC2로 보내야 하므로, 여기서 빌드 후 전송.
          
          npm ci --prefix frontend
          npm run build --prefix frontend

          echo "=== 프론트엔드 dist 전송 ==="
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/frontend/dist
          
          # docker-compose.yml 전송
          echo "=== docker-compose.yml 전송 ==="
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/
            
          # 3. 원격 실행 (이미지 풀 -> 실행)
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST "
            cd /home/ubuntu/twiiiins/Twiiiins
            
            # GHCR 로그인 (이미지 받기 위해)
            cat gh_token.txt | docker login ghcr.io -u $USERNAME --password-stdin
            rm gh_token.txt

            # 최신 이미지 다운로드
            docker-compose pull backend
            
            # 서비스 실행
            docker-compose up -d
            docker-compose ps
            
            # 로그 확인 (잠시)
            sleep 5
            docker-compose logs --tail=20 backend
          "
          
          # SSH 키 정리
          rm -f ~/.ssh/deploy_key
          rm -f gh_token.txt
