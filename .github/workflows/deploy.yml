name: Deploy to OCI (ARM)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'assets/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --build-cache --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/twiiiins-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Validate frontend artifact
        run: |
          test -s frontend/dist/index.html
          find frontend/dist -maxdepth 2 -type f | head -n 20

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FILE_UPLOAD_DIR: ${{ secrets.FILE_UPLOAD_DIR }}
          FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
          UPLOAD_MAX_SIZE: ${{ secrets.UPLOAD_MAX_SIZE }}
        run: |
          set -euo pipefail

          required_vars=(
            EC2_HOST
            EC2_USER
            EC2_SSH_KEY
            DB_PASSWORD
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::$var_name is required"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key .env frontend-dist.tar.gz' EXIT

          test -s frontend/dist/index.html
          tar -C frontend/dist -czf frontend-dist.tar.gz .

          cat > .env <<EOF
          DB_URL=$DB_URL
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          CORS_ORIGINS=${CORS_ORIGINS:-https://twiiiins.com,https://www.twiiiins.com}
          FILE_UPLOAD_DIR=${FILE_UPLOAD_DIR:-uploads}
          FILE_BASE_URL=${FILE_BASE_URL:-/uploads}
          UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-104857600}
          GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
          EOF

          echo "=== Prepare remote deployment directory ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            set -e
            TARGET_DIR="$HOME/twiiiins/Twiiiins"

            echo "=== Disk usage ==="
            df -h

            mkdir -p "$TARGET_DIR/frontend/dist"
            mkdir -p "$TARGET_DIR/aws/nginx"
            mkdir -p "$TARGET_DIR/scripts"
            mkdir -p "$TARGET_DIR/uploads"
            mkdir -p "$TARGET_DIR/db_data"
            chmod 777 "$TARGET_DIR/uploads" 2>/dev/null || true
          ENDSSH

          echo "=== Log in to GHCR on remote host ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          echo "=== Transfer deployment files ==="
          scp -i ~/.ssh/deploy_key .env "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/"
          scp -i ~/.ssh/deploy_key frontend-dist.tar.gz "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/frontend-dist.tar.gz"
          scp -i ~/.ssh/deploy_key aws/nginx/nginx.conf "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/aws/nginx/nginx.conf"
          scp -i ~/.ssh/deploy_key aws/init-letsencrypt.sh "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/aws/init-letsencrypt.sh"
          scp -r -i ~/.ssh/deploy_key scripts "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/" || true

          echo "=== Install frontend artifact on remote host ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            set -e
            TARGET_DIR="$HOME/twiiiins/Twiiiins"

            rm -rf "$TARGET_DIR/frontend/dist"
            mkdir -p "$TARGET_DIR/frontend/dist"
            tar -xzf "$TARGET_DIR/frontend-dist.tar.gz" -C "$TARGET_DIR/frontend/dist"
            rm -f "$TARGET_DIR/frontend-dist.tar.gz"

            test -s "$TARGET_DIR/frontend/dist/index.html"
            echo "=== Remote frontend files ==="
            find "$TARGET_DIR/frontend/dist" -maxdepth 2 -type f | head -n 20
          ENDSSH

          echo "=== Pull backend image and update services ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            cd ~/twiiiins/Twiiiins

            docker compose config >/dev/null
            docker compose pull backend
            docker compose up -d backend
            docker compose up -d --force-recreate nginx
            docker compose up -d certbot
            docker compose ps

            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            docker compose exec -T nginx test -s /usr/share/nginx/html/index.html
            docker compose exec -T nginx ls -la /usr/share/nginx/html | head
            docker compose exec -T nginx sh -c "nginx -T 2>/dev/null | grep -q 'location = /'"
            docker compose exec -T nginx sh -c "grep -q '<div id=\"app\"></div>' /usr/share/nginx/html/index.html"

            echo "=== Backend Container Logs ==="
            sleep 5
            docker logs twiiiins-backend 2>&1 | tail -n 50 || echo "Container not running..."
          EOF

          echo "=== Public site smoke test ==="
          curl -fsSL --retry 5 --retry-delay 5 https://twiiiins.com/index.html | grep -q '<div id="app"></div>'
          curl -fsSL --retry 5 --retry-delay 5 https://twiiiins.com/ | grep -q '<div id="app"></div>'
          curl -fsSIL --retry 5 --retry-delay 5 https://twiiiins.com/Website_logo.jpg
          curl -fsS --retry 5 --retry-delay 5 https://twiiiins.com/health
