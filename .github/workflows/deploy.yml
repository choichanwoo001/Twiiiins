name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          # SSH 키 설정
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # 디스크 공간 정리 및 디렉토리 생성 (배포 전 중지 -> 청소 -> 준비)
          echo "=== 배포 전 서비스 중지 및 디스크 정리 ==="
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            # 프로젝트 디렉토리 생성 (없을 경우 대비)
            mkdir -p /home/ubuntu/twiiiins/Twiiiins
            
            # 1. 먼저 서비스 중지 (그래야 이미지를 지울 수 있음)
            cd /home/ubuntu/twiiiins/Twiiiins || true
            if [ -f "docker-compose.yml" ]; then
              docker-compose down || true
            fi

            # 2. Docker 리소스 정리 (중지된 컨테이너/이미지 삭제)
            docker system prune -af --volumes || true
            docker builder prune -af || true

            # 2.1 강력한 시스템 청소 (Disk Full 방지)
            # 시스템 로그 정리 (최근 50M만 유지)
            sudo journalctl --vacuum-size=50M || true
            # 패키지 캐시 정리
            sudo apt-get clean || true
            sudo apt-get autoremove -y || true
            # 오래된 Snap 버전 정리 (디스크 킬러)
            sudo bash -c 'set -eu; snap list --all | awk "/disabled/{print \$1, \$3}" | while read snapname revision; do snap remove "$snapname" --revision="$revision"; done' || true
            
            # 3. 기타 파일 정리
            # 로그 파일 정리
            find /home/ubuntu/twiiiins/Twiiiins -name "*.log" -type f -mtime +30 -delete 2>/dev/null || true
            
            # 백엔드 빌드 캐시 정리
            rm -rf /home/ubuntu/twiiiins/Twiiiins/backend/build/* 2>/dev/null || true
            rm -rf /home/ubuntu/twiiiins/Twiiiins/backend/.gradle/caches/* 2>/dev/null || true
            
            # 프론트엔드 빌드 캐시 정리
            rm -rf /home/ubuntu/twiiiins/Twiiiins/frontend/.vite 2>/dev/null || true
            rm -rf /home/ubuntu/twiiiins/Twiiiins/frontend/.cache 2>/dev/null || true
            
            # 디렉토리 구조 확보
            mkdir -p /home/ubuntu/twiiiins/Twiiiins/frontend
            mkdir -p /home/ubuntu/twiiiins/Twiiiins/backend
            
            # 디스크 사용량 확인
            df -h
          ENDSSH
          
          # 프론트엔드 dist 전송
          echo "=== 프론트엔드 dist 전송 ==="
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/frontend/dist
          
          # 백엔드 소스 코드 전송
          echo "=== 백엔드 소스 코드 전송 ==="
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'build/' \
            --exclude '.gradle/' \
            --exclude 'uploads/' \
            --exclude 'logs/' \
            --exclude '*.log' \
            --exclude 'bin/' \
            --exclude 'out/' \
            backend/ $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/backend
          
          # docker-compose.yml 전송
          echo "=== docker-compose.yml 전송 ==="
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml $EC2_USER@$EC2_HOST:/home/ubuntu/twiiiins/Twiiiins/
          
          # 원격 기동 (compose up)
          echo "=== 원격 기동 (compose up) ==="
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            cd /home/ubuntu/twiiiins/Twiiiins
            # 이미 위에서 down 했으므로 바로 빌드 및 실행
            # --no-cache 제거하여 메모리 절약 및 속도 향상 (변경점 있을때만 다시 빌드)
            docker-compose build backend
            docker-compose up -d
            docker-compose ps
            docker-compose logs --tail=50 backend
          ENDSSH
          
          # SSH 키 정리
          rm -f ~/.ssh/deploy_key
