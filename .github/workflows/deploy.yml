name: Deploy to OCI (ARM)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'assets/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --build-cache --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/twiiiins-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Validate frontend artifact
        run: |
          test -s frontend/dist/index.html
          find frontend/dist -maxdepth 2 -type f | head -n 20

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FILE_UPLOAD_DIR: ${{ secrets.FILE_UPLOAD_DIR }}
          FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
          UPLOAD_MAX_SIZE: ${{ secrets.UPLOAD_MAX_SIZE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          NEWSLETTER_ENABLED: ${{ secrets.NEWSLETTER_ENABLED }}
          NEWSLETTER_TOKEN_KEY: ${{ secrets.NEWSLETTER_TOKEN_KEY }}
          NEWSLETTER_PUBLIC_URL: ${{ secrets.NEWSLETTER_PUBLIC_URL }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_REPLY_TO: ${{ secrets.NEWSLETTER_REPLY_TO }}
          NEWSLETTER_OPERATOR: ${{ secrets.NEWSLETTER_OPERATOR }}
          NEWSLETTER_TEST_RECIPIENTS: ${{ secrets.NEWSLETTER_TEST_RECIPIENTS }}
          NEWSLETTER_PER_MINUTE: ${{ secrets.NEWSLETTER_PER_MINUTE }}
          NEWSLETTER_DAILY_LIMIT: ${{ secrets.NEWSLETTER_DAILY_LIMIT }}
          DEFAULT_ADMIN_USERNAME: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
          DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          required_vars=(
            EC2_HOST
            EC2_USER
            EC2_SSH_KEY
            DB_PASSWORD
          )
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::$var_name is required"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key .env frontend-dist.tar.gz' EXIT

          test -s frontend/dist/index.html
          tar -C frontend/dist -czf frontend-dist.tar.gz .

          python3 - <<'PYENV'
          import json
          import os
          from pathlib import Path
          defaults = {
              "DB_URL": "", "DB_USERNAME": "", "DB_PASSWORD": "",
              "CORS_ORIGINS": "https://twiiiins.com,https://www.twiiiins.com",
              "FILE_UPLOAD_DIR": "uploads", "FILE_BASE_URL": "/uploads", "UPLOAD_MAX_SIZE": "104857600",
              "GITHUB_REPOSITORY_OWNER": "",
          }
          optional = "SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_AUTH SMTP_STARTTLS SMTP_SSL NEWSLETTER_ENABLED NEWSLETTER_TOKEN_KEY NEWSLETTER_PUBLIC_URL NEWSLETTER_FROM NEWSLETTER_REPLY_TO NEWSLETTER_OPERATOR NEWSLETTER_TEST_RECIPIENTS NEWSLETTER_PER_MINUTE NEWSLETTER_DAILY_LIMIT DEFAULT_ADMIN_USERNAME DEFAULT_ADMIN_PASSWORD".split()
          defaults.update({key: "" for key in optional})
          lines = []
          for key, fallback in defaults.items():
              value = os.environ.get(key) or fallback
              quoted = json.dumps(value, ensure_ascii=False).replace("$", "$$")
              lines.append(f"{key}={quoted}")
          target = Path(".env")
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          target.chmod(0o600)
          PYENV

          echo "=== Prepare remote deployment directory ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            set -e
            TARGET_DIR="$HOME/twiiiins/Twiiiins"

            echo "=== Disk usage ==="
            df -h

            mkdir -p "$TARGET_DIR/frontend/dist"
            mkdir -p "$TARGET_DIR/aws/nginx"
            mkdir -p "$TARGET_DIR/scripts"
            mkdir -p "$TARGET_DIR/uploads"
            mkdir -p "$TARGET_DIR/db_data"
            chmod 777 "$TARGET_DIR/uploads" 2>/dev/null || true
          ENDSSH

          echo "=== Log in to GHCR on remote host ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          echo "=== Transfer deployment files ==="
          scp -i ~/.ssh/deploy_key .env "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/"
          scp -i ~/.ssh/deploy_key frontend-dist.tar.gz "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/frontend-dist.tar.gz"
          scp -i ~/.ssh/deploy_key aws/nginx/nginx.conf "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/aws/nginx/nginx.conf"
          scp -i ~/.ssh/deploy_key aws/init-letsencrypt.sh "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/aws/init-letsencrypt.sh"
          scp -r -i ~/.ssh/deploy_key scripts "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/" || true
          scp -i ~/.ssh/deploy_key scripts/migrate-newsletter.sql "$EC2_USER@$EC2_HOST:~/twiiiins/Twiiiins/scripts/"

          echo "=== Install frontend artifact on remote host ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            set -e
            TARGET_DIR="$HOME/twiiiins/Twiiiins"

            rm -rf "$TARGET_DIR/frontend/dist"
            mkdir -p "$TARGET_DIR/frontend/dist"
            tar -xzf "$TARGET_DIR/frontend-dist.tar.gz" -C "$TARGET_DIR/frontend/dist"
            rm -f "$TARGET_DIR/frontend-dist.tar.gz"

            test -s "$TARGET_DIR/frontend/dist/index.html"
            echo "=== Remote frontend files ==="
            find "$TARGET_DIR/frontend/dist" -maxdepth 2 -type f | head -n 20
          ENDSSH

          echo "=== Pull backend image and update services ==="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            cd ~/twiiiins/Twiiiins

            docker compose config >/dev/null
            docker compose pull backend
            docker compose stop backend
            umask 077
            mkdir -p backups
            echo "=== Back up database ==="
            backup_file="backups/pre-newsletter-$(date -u +%Y%m%dT%H%M%SZ).sql"
            docker compose exec -T --interactive=false db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -u root --single-transaction --no-tablespaces "$MYSQL_DATABASE"' > "$backup_file"
            test -s "$backup_file"
            echo "=== Migrate newsletter schema ==="
            docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root "$MYSQL_DATABASE"' < scripts/migrate-newsletter.sql
            echo "=== Restart services ==="
            docker compose up -d backend
            docker compose up -d --force-recreate nginx
            docker run --rm \
              -v "$PWD/aws/nginx/data/certbot/www:/var/www/certbot" \
              alpine:3.20 \
              mkdir -p /var/www/certbot/.well-known/acme-challenge
            docker compose up -d --force-recreate certbot
            docker compose ps

            certificate_ready=0
            for attempt in $(seq 1 12); do
              if docker compose exec -T --interactive=false certbot \
                test -e /tmp/certbot-renew-ok; then
                certificate_ready=1
                break
              fi
              sleep 5
            done

            if [ "$certificate_ready" -ne 1 ]; then
              docker compose logs --tail=100 certbot
              exit 1
            fi

            docker compose exec -T --interactive=false nginx nginx -t
            docker compose exec -T --interactive=false nginx nginx -s reload
            docker compose exec -T --interactive=false nginx test -s /usr/share/nginx/html/index.html
            docker compose exec -T --interactive=false nginx ls -la /usr/share/nginx/html | head
            docker compose exec -T --interactive=false nginx sh -c "nginx -T 2>/dev/null | grep -q 'location = /'"
            docker compose exec -T --interactive=false nginx sh -c "grep -q '<div id=\"app\"></div>' /usr/share/nginx/html/index.html"

            echo "=== Backend Container Logs ==="
            sleep 5
            docker logs twiiiins-backend 2>&1 | tail -n 50 || echo "Container not running..."
          EOF

          echo "=== Public site smoke test ==="
          curl -fsSL --retry 5 --retry-delay 5 https://twiiiins.com/index.html | grep -q '<div id="app"></div>'
          curl -fsSL --retry 5 --retry-delay 5 https://twiiiins.com/ | grep -q '<div id="app"></div>'
          curl -fsSIL --retry 5 --retry-delay 5 https://twiiiins.com/Website_logo.jpg
          curl -fsS --retry 5 --retry-delay 5 https://twiiiins.com/health
