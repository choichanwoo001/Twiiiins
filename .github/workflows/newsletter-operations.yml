name: Newsletter operational check

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'preflight/diagnose: read-only; publication checks: temporary posts, no email; verify: test-recipient email'
        required: true
        default: preflight
        type: choice
        options: [preflight, diagnose, verify-publication, verify-single-language, verify-translation, diagnose-translation, verify]

permissions:
  contents: read

concurrency:
  group: newsletter-operational-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check newsletter on the server
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/newsletter_key
          chmod 600 ~/.ssh/newsletter_key
          trap 'rm -f ~/.ssh/newsletter_key' EXIT
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/newsletter_key scripts/newsletter-operational-check.py "$SSH_USER@$SSH_HOST:~/twiiiins/Twiiiins/scripts/"
          scp -i ~/.ssh/newsletter_key scripts/translation_operational_check.py "$SSH_USER@$SSH_HOST:~/twiiiins/Twiiiins/scripts/"
          if [ "$OPERATION" = "diagnose-translation" ]; then
            ssh -i ~/.ssh/newsletter_key "$SSH_USER@$SSH_HOST" \
              "cd ~/twiiiins/Twiiiins && python3 scripts/translation_operational_check.py --diagnose"
            exit 0
          fi
          if [ "$OPERATION" = "verify-translation" ]; then
            ssh -i ~/.ssh/newsletter_key "$SSH_USER@$SSH_HOST" \
              "cd ~/twiiiins/Twiiiins && python3 scripts/translation_operational_check.py"
            exit 0
          fi
          ssh -i ~/.ssh/newsletter_key "$SSH_USER@$SSH_HOST" \
            "cd ~/twiiiins/Twiiiins && python3 scripts/newsletter-operational-check.py $OPERATION"
