services:
  # Spring Boot 백엔드
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: twiiiins-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=8080
      - FILE_UPLOAD_DIR=${FILE_UPLOAD_DIR}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE}
      # AWS S3 설정 (Spring Boot는 환경 변수를 자동으로 매핑: AWS_ACCESS_KEY_ID -> aws.access-key-id)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - twiiiins-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 리버스 프록시 (선택사항)
  nginx:
    image: nginx:alpine
    container_name: twiiiins-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./aws/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./aws/nginx/ssl:/etc/nginx/ssl
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - twiiiins-network

networks:
  twiiiins-network:
    driver: bridge
