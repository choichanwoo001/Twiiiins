version: '3.8'

services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: twiiiins-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-twiiiins_root_password}
      MYSQL_DATABASE: twiiiins
      MYSQL_USER: ${DB_USERNAME:-twiiiins_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-twiiiins_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - twiiiins-network

  # Spring Boot 백엔드
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: twiiiins-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/twiiiins?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME:-twiiiins_user}
      - DB_PASSWORD=${DB_PASSWORD:-twiiiins_password}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here_32_chars_minimum}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - PORT=8080
      - FILE_UPLOAD_DIR=/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - twiiiins-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 리버스 프록시 (선택사항)
  nginx:
    image: nginx:alpine
    container_name: twiiiins-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - twiiiins-network

volumes:
  mysql_data:
    driver: local

networks:
  twiiiins-network:
    driver: bridge
