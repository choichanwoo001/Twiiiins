services:
  # 1. 데이터베이스 (OCI 관리용 - 배포 시 자동 재시작 안 함)
  db:
    image: mysql:8.0 # ARM64 공식 지원
    container_name: twiiiins-db
    restart: always
    environment:
      MYSQL_DATABASE: twiiiins
      MYSQL_USER: user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - twiiiins-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Spring Boot 백엔드
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/twiiiins-backend:latest
    container_name: twiiiins-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # OCI 내부 DB 접속 정보 (서비스명 'db' 사용)
      - DB_URL=jdbc:mysql://db:3306/twiiiins?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - DB_USERNAME=user # 위에서 설정한 유저명
      - DB_PASSWORD=${DB_PASSWORD}
      # 기존 환경변수 유지
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PORT=8080
      - FILE_UPLOAD_DIR=${FILE_UPLOAD_DIR}
      - FILE_BASE_URL=${FILE_BASE_URL:-/uploads}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - twiiiins-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: twiiiins-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./aws/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./aws/nginx/data/certbot/conf:/etc/letsencrypt
      - ./aws/nginx/data/certbot/www:/var/www/certbot
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - twiiiins-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: twiiiins-certbot
    volumes:
      - ./aws/nginx/data/certbot/conf:/etc/letsencrypt
      - ./aws/nginx/data/certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      /bin/sh -c ' apk add --no-cache docker-cli && trap exit TERM; while :; do
        certbot renew --deploy-hook "docker kill -s SIGHUP twiiiins-nginx" --quiet;
        sleep 12h & wait $${!};
      done; '
    networks:
      - twiiiins-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  twiiiins-network:
    driver: bridge
