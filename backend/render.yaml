services:
  - type: web
    name: twiiiins-backend
    env: java
    buildCommand: ./gradlew build
    startCommand: java -Dserver.port=$PORT -jar build/libs/*.jar
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app
