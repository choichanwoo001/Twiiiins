plugins {
	id 'java'
    id 'jacoco'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.twiiiins'
version = '0.0.1-SNAPSHOT'

// Keep the 1.x API while supporting current Docker Engine API negotiation.
ext['testcontainers.version'] = '1.21.4'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.jsoup:jsoup:1.22.1'
	
	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	
	// Stripe
	implementation 'com.stripe:stripe-java:24.0.0'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'
	
	// Dotenv
	implementation 'io.github.cdimascio:dotenv-java:3.0.0'
	
	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
	
	// Image processing (메모리 효율적인 이미지 리사이징)
	implementation 'net.coobird:thumbnailator:0.4.20'
	
	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'mysql' }
    systemProperty 'app.env.disabled', 'true'
    systemProperty 'app.file.upload-dir', layout.buildDirectory.dir('test-uploads').get().asFile.absolutePath
    systemProperty 'logging.file.name', layout.buildDirectory.file('test-backend.log').get().asFile.absolutePath
    systemProperty 'app.scheduling.enabled', 'false'
    finalizedBy jacocoTestReport
}

// JVM 인코딩 설정
tasks.named('bootRun') {
	systemProperty 'file.encoding', 'UTF-8'
	systemProperty 'sun.jnu.encoding', 'UTF-8'
}

// JAR 파일명 설정
jar {
	enabled = false
	archiveClassifier = ''
}

bootJar {
	archiveFileName = "twiiiins-backend-${version}.jar"
}



tasks.register('mysqlTest', Test) {
    description = 'Runs real MySQL contracts; Docker is required (never silently skipped).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    systemProperty 'app.env.disabled', 'true'
    systemProperty 'app.file.upload-dir', layout.buildDirectory.dir('test-uploads').get().asFile.absolutePath
    systemProperty 'logging.file.name', layout.buildDirectory.file('test-backend.log').get().asFile.absolutePath
    systemProperty 'app.scheduling.enabled', 'false'
    shouldRunAfter test
}
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}
