spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  application:
    name: twiiiins-backend
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${JPA_FORMAT_SQL:false}
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:104857600}  # 100MB - 개별 파일 크기 제한
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:524288000}  # 500MB - 전체 요청 크기 제한 (여러 파일 동시 업로드 지원)
      file-size-threshold: ${MULTIPART_FILE_SIZE_THRESHOLD:52428800}  # 50MB - 이 값 이하는 메모리에 저장
      location: ${MULTIPART_LOCATION:}  # 임시 파일 저장 위치 (비어있으면 시스템 기본값 사용)
      enabled: true
      resolve-lazily: false  # 필요시 true로 변경 가능 (Spring Boot 2.1+)

server:
  forward-headers-strategy: native
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

logging:
  level:
    com.twiiiins: ${LOG_LEVEL:INFO}
    com.twiiiins.service: ${SERVICE_LOG_LEVEL:DEBUG}
    com.twiiiins.controller: ${CONTROLLER_LOG_LEVEL:INFO}
    com.twiiiins.exception: ${EXCEPTION_LOG_LEVEL:WARN}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:WARN}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BINDER_LOG:WARN}
    org.springframework.transaction: ${TRANSACTION_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/twiiiins-backend.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}
    total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:1GB}
  charset:
    console: UTF-8
    file: UTF-8

app:
  newsletter:
    enabled: ${NEWSLETTER_ENABLED:false}
    token-key: ${NEWSLETTER_TOKEN_KEY:}
    public-url: ${NEWSLETTER_PUBLIC_URL:https://twiiiins.com}
    from: ${NEWSLETTER_FROM:}
    reply-to: ${NEWSLETTER_REPLY_TO:}
    operator: ${NEWSLETTER_OPERATOR:}
    test-recipients: ${NEWSLETTER_TEST_RECIPIENTS:}
    local-mailbox-url: ${NEWSLETTER_LOCAL_MAILBOX_URL:}
    per-minute: ${NEWSLETTER_PER_MINUTE:10}
    daily-limit: ${NEWSLETTER_DAILY_LIMIT:300}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
  
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_BASE_URL:/uploads}
    max-size: ${FILE_MAX_SIZE:104857600}  # 100MB in bytes

# CORS 설정은 SecurityConfig.java에서 환경 변수 CORS_ORIGINS로 직접 처리합니다.
# 주석 처리된 설정은 참고용입니다.
# cors:
#   allowed-origins: ${CORS_ORIGINS:http://localhost:5173,https://twiiiins.com,https://www.twiiiins.com}
#   allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
#   allowed-headers: ${CORS_HEADERS:*}
#   allow-credentials: ${CORS_CREDENTIALS:true}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

