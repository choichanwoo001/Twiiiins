<!doctype html>
<html lang="{{language}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{title}}</title>
<style>
@font-face{font-family:Jost;src:url("{{fontBase}}Jost-400-Book.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:Jost;src:url("{{fontBase}}Jost-400-BookItalic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:swap;}
@font-face{font-family:Jost;src:url("{{fontBase}}Jost-700-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:Jost;src:url("{{fontBase}}Jost-800-Heavy.ttf") format("truetype");font-weight:800;font-style:normal;font-display:swap;}
</style></head>
<body style="margin:0;padding:0;background:#FFFFFF;color:#1E1D1D;font-family:Jost,Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#FFFFFF" style="background:#FFFFFF;width:100%;table-layout:fixed;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;table-layout:fixed;color:#1E1D1D;font-family:Jost,Arial,Helvetica,sans-serif;"><tr><td style="overflow-wrap:anywhere;word-wrap:break-word;">
<p style="margin:0 0 6px;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-2px;"><span style="background:#943C31;color:#FFFFFF;padding:0 8px;">TWIIIINS</span></p>
<p style="margin:0 0 28px;font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-1px;"><span style="padding:2px 8px;">NEWSLETTER</span></p>
<h1 style="margin:0 0 28px;font-size:42px;line-height:1.08;letter-spacing:-1.5px;font-weight:800;overflow-wrap:anywhere;word-break:break-word;">{{title}}</h1>
{{hero}}
{{details}}
<div style="font-size:16px;line-height:1.6;color:#1E1D1D;">{{body}}</div>
{{gallery}}
{{actions}}
<!--NEWSLETTER_LIGHT_FOOTER-->
</td></tr></table></td></tr></table></body></html>
